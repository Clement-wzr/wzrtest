    let btnDisabled = false;
    let btnActive = false;
    if (app.mode === "loading") {
      btnLabel = "连接中";
      btnLoading = true;
      btnDisabled = true;
    } else if (app.mode === "camera") {
      btnLabel = "关闭手势";
      btnActive = true;
    }
    if (cameraBtnLabel.textContent !== btnLabel) cameraBtnLabel.textContent = btnLabel;
    cameraBtn.classList.toggle("loading", btnLoading);
    cameraBtn.classList.toggle("active", btnActive);
    cameraBtn.disabled = btnDisabled;
    cameraBtn.setAttribute("aria-pressed", btnActive ? "true" : "false");
    demoBtn.classList.toggle("active", app.mode === "demo");
    demoBtn.setAttribute("aria-pressed", app.mode === "demo" ? "true" : "false");
    const demoLabel = app.mode === "demo" ? "退出演示" : "演示";
    if (demoBtnLabel.textContent !== demoLabel) demoBtnLabel.textContent = demoLabel;
  }

  // ─────────────────────────────────────────────────────────────
  // 比耶手势彩蛋 · 黑底白字来信
  // ─────────────────────────────────────────────────────────────
  const STORY_TEXT_EXPECTED = "你好使用者我是河北外国语学院计算机学院26级软件工程学生王泽瑞非常感谢你看到这句话对看到这句话的人我将会祝福你们天天开心期末必过";

  const STORY_MAIN_SPECS = [
    { className: "greeting", segments: [{ text: "你好使用者" }] },
    { className: "accent-line", segments: [{ text: "我是" }, { text: "河北外国语学院计算机学院", className: "accent" }] },
    { segments: [{ text: "26级软件工程学生" }, { text: "王泽瑞", className: "name" }] },
    { segments: [{ text: "非常感谢你看到这句话", className: "soft" }] },
    { segments: [{ text: "对看到这句话的人" }] },
    { segments: [{ text: "我将会祝福你们" }] }
  ];

  const STORY_BLESS_SPECS = [
    { segments: [{ text: "天天开心" }] },
    { segments: [{ text: "期末必过" }] }
  ];

  function storySpecsText(specs) {
    return specs.map((line) => line.segments.map((segment) => segment.text).join("")).join("");
  }

  const STORY_COMPOSED_TEXT = storySpecsText(STORY_MAIN_SPECS) + storySpecsText(STORY_BLESS_SPECS);
  if (STORY_COMPOSED_TEXT !== STORY_TEXT_EXPECTED) {
    console.warn("[EVERGREEN] intro text mismatch", STORY_COMPOSED_TEXT);
  }

  function clearStoryTimers() {
    for (const timer of story.timers) clearTimeout(timer);
    story.timers.length = 0;
  }

  function storyLater(fn, delay) {
    const runId = story.runId;
    const timer = window.setTimeout(() => {
      if (!story.open || runId !== story.runId) return;
      fn();
    }, Math.max(0, delay));
    story.timers.push(timer);
    return timer;
  }

  function buildStoryLines(container, specs) {
    container.textContent = "";
    const entries = [];
    specs.forEach((lineSpec) => {
      const line = document.createElement("div");
      line.className = "story-line" + (lineSpec.className ? " " + lineSpec.className : "");
      let lastEntry = null;
      for (const segment of lineSpec.segments) {
        for (const character of Array.from(segment.text)) {
          const span = document.createElement("span");
          span.className = "story-char" + (segment.className ? " " + segment.className : "");
          span.textContent = character;
          line.appendChild(span);
          lastEntry = { el: span, ch: character, lineEnd: false };
          entries.push(lastEntry);
        }
      }
      if (lastEntry) lastEntry.lineEnd = true;
      container.appendChild(line);
    });
    return entries;
  }

  function typeStoryEntries(entries, options, onDone) {
    let index = 0;
    let cursor = null;
    const runId = story.runId;

    function step() {
      if (!story.open || runId !== story.runId) return;
      if (index >= entries.length) {
        if (cursor) cursor.classList.remove("is-cursor");
        story.cursorEl = null;
        onDone?.();
        return;
      }
      const entry = entries[index++];
      if (cursor) cursor.classList.remove("is-cursor");
      entry.el.classList.add("typed", "is-cursor");
      cursor = entry.el;
      story.cursorEl = cursor;

      let delay = options.base;
      if (/[，。！？、；：,.!?]/.test(entry.ch)) delay += options.punctPause;
      if (entry.lineEnd) delay += options.linePause;
      storyLater(step, delay);
    }

    storyLater(step, options.lead || 0);
  }

  function startLetterTyping() {
    story.chars = buildStoryLines(storyLines, STORY_MAIN_SPECS);
    storySign.classList.remove("is-visible");
    storyBlessFoot.classList.remove("is-visible");
    storyBlessPage.classList.remove("is-complete");

    typeStoryEntries(
      story.chars,
      {
        base: reducedMotion ? 44 : 78,
        punctPause: reducedMotion ? 85 : 170,
        linePause: reducedMotion ? 100 : 220,
        lead: 0
      },
      () => {
        storySign.classList.add("is-visible");
        storyLater(transitionToBlessingPage, 3000);
      }
    );
  }

  function setupStoryParticles() {
    if (!view.w || !view.h) return;
    const count = clamp(Math.round((view.w * view.h) / 11500), 70, 210);
    const cx = view.w / 2;
    const cy = view.h / 2;
    const safeW = Math.min(view.w * 0.74, 940);
    const safeH = Math.min(view.h * 0.38, 340);
    const particles = [];

    for (let i = 0; i < count; i++) {
      let x = 0;
      let y = 0;
      for (let tries = 0; tries < 22; tries++) {
        x = rand(0, view.w);
        y = rand(0, view.h);
        const insideText = Math.abs(x - cx) < safeW / 2 && Math.abs(y - cy) < safeH / 2;
        if (!insideText || Math.random() < 0.16) break;
      }
      particles.push({
        x, y,
        r: rand(0.55, 2.2),
        alpha: rand(0.18, 0.72),
        phase: rand(0, TAU),
        tw: rand(0.25, 1.25),
        dx: rand(0.05, 0.2),
        dy: rand(0.04, 0.16),
        amp: rand(3, 17),
        star: Math.random() < 0.14
      });
    }
    story.particles = particles;
    story.particleSeed++;
  }

  function drawStoryParticles(now) {
    if (!story.open || story.page !== 2) return;
    const w = view.w;
    const h = view.h;
    const t = now / 1000;
    const fade = smoothstep(0, 1.8, (now - story.pageStartedAt) / 1000);
    storyCtx.clearRect(0, 0, w, h);
    storyCtx.globalCompositeOperation = "lighter";
    const sprite = getSprite("white");

    for (const p of story.particles) {
      const x = p.x + Math.sin(t * p.dx + p.phase) * p.amp;
      const y = p.y + Math.cos(t * p.dy + p.phase) * p.amp * 0.72;
      const twinkle = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * p.tw + p.phase * 1.7));
      const alpha = p.alpha * twinkle * fade;
      if (alpha < 0.008) continue;
      const size = p.r * 3.2;
      storyCtx.globalAlpha = alpha;
      storyCtx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
      if (p.star) {
        storyCtx.globalAlpha = alpha * 0.52;
        storyCtx.strokeStyle = "rgba(255,255,255,.8)";
        storyCtx.lineWidth = 0.55;
        storyCtx.beginPath();
        storyCtx.moveTo(x - size * 1.15, y);
        storyCtx.lineTo(x + size * 1.15, y);
        storyCtx.moveTo(x, y - size * 1.15);
        storyCtx.lineTo(x, y + size * 1.15);
        storyCtx.stroke();
      }
    }

    storyCtx.globalAlpha = 1;
    storyCtx.globalCompositeOperation = "source-over";
  }

  function updateStoryFrame(now) {
    if (!story.open) return;
    if (story.page === 2) {
      drawStoryParticles(now);
    } else {
      storyCtx.clearRect(0, 0, view.w, view.h);
    }
  }

  function stopEverythingForStory() {
    if (app.mode === "camera" || app.mode === "loading") {
      app.camera.token++;
      releaseCameraMedia();
    }
    if (app.mode === "demo") {
      app.demo.down = false;
      app.demo.keyOpen = false;
      app.demo.pointerActive = false;
      app.demo.debugOpen = false;
    }
    app.mode = "idle";
    app.gesture = "none";
    app.hasHand = false;
    app.peaceSince = 0;
    app.photoFocusIndex = -1;
    app.photoFocusHoldUntil = 0;
    app.photoAimIndex = -1;
    app.photoDebugFocus = -1;
    app.openTarget = 0;
    app.camera.candidate = "none";
    app.camera.candidateFrames = 0;
    app.lastSeen = 0;
    lastUiKey = "";
    clearTimeout(toastTimer);
    toast.classList.remove("show");
  }

  function openStory(source = "key") {
    if (story.open) return;
    story.runId++;
    clearStoryTimers();
    story.open = true;
    story.page = 0;
    story.chars = [];
    story.cursorEl = null;
    const activeBeforeStory = document.activeElement;
    story.previousFocus = activeBeforeStory && !storyEl.contains(activeBeforeStory) ? activeBeforeStory : cameraBtn;
    story.pageStartedAt = performance.now();
    stopEverythingForStory();

    storyEl.classList.remove("is-open", "is-blessing", "is-turning");
    storyLetterPage.classList.remove("is-leaving");
    storyLetterPage.classList.add("is-active");
    storyBlessPage.classList.remove("is-active");
    storyBlessFoot.classList.remove("is-visible");
    storySign.classList.remove("is-visible");
    storyLines.textContent = "";
    storyBlessLines.textContent = "";
    storyA11y.textContent = STORY_TEXT_EXPECTED;

    storyEl.setAttribute("aria-describedby", "storyA11y");

    storyLater(() => {

  function transitionToBlessingPage() {
    if (!story.open) return;
    storyEl.classList.add("is-turning");
    storyLetterPage.classList.add("is-leaving");

    const entries = buildStoryLines(storyBlessLines, STORY_BLESS_SPECS);
    storyLater(() => {
      if (!story.open) return;
      storyLetterPage.classList.remove("is-active", "is-leaving");
      storyEl.classList.add("is-blessing");
      storyBlessPage.classList.add("is-active");
      story.page = 2;
      story.pageStartedAt = performance.now();
      setupStoryParticles();
      storyBlessFoot.classList.remove("is-visible");
      storyBlessPage.classList.remove("is-complete");

      storyLater(() => {
        if (!story.open) return;
        typeStoryEntries(
          entries,
          {
            base: reducedMotion ? 70 : 148,
            punctPause: reducedMotion ? 190 : 420,
            linePause: reducedMotion ? 140 : 330,
            lead: 300
          },
          () => {
            storyBlessPage.classList.add("is-complete");
            storyBlessFoot.classList.add("is-visible");
          }
        );
      }, 760);
    }, 680);

    storyLater(() => {
      storyEl.classList.remove("is-turning");
    }, 1900);

  function closeStory(source = "close") {
    if (!story.open) return;
    story.open = false;
    story.runId++;
    clearStoryTimers();
    story.typing = false;
    story.cursorEl = null;

    document.body.classList.remove("story-open");
    storyEl.classList.remove("is-open", "is-blessing", "is-turning");
    storyEl.setAttribute("aria-hidden", "true");
    document.querySelectorAll(".topbar, .footer, .camera-card").forEach((el) => { el.inert = false; });

    const cleanupRun = story.runId;
    const previousFocus = story.previousFocus;
    story.previousFocus = null;
    window.setTimeout(() => {
      if (story.open || story.runId !== cleanupRun) return;
      storyLetterPage.classList.remove("is-active", "is-leaving");
      storyBlessPage.classList.remove("is-active", "is-complete");
      storyBlessFoot.classList.remove("is-visible");
      storySign.classList.remove("is-visible");
      storyLines.textContent = "";
      storyBlessLines.textContent = "";
      storyA11y.textContent = "";
      story.particles = [];
      story.page = 0;
      storyCtx.clearRect(0, 0, view.w, view.h);
    }, 980);

    window.setTimeout(() => {
      if (story.open) return;
      if (previousFocus && previousFocus.isConnected && typeof previousFocus.focus === "function") {
        previousFocus.focus({ preventScroll: true });
      } else {
        cameraBtn.focus({ preventScroll: true });
      }
      showToast("已返回圣诞树 · 按 O 或比耶可再次打开来信", 4200);
    }, 720);

    app.lastFrame = performance.now();
  }

  storyCloseBtn.addEventListener("click", () => closeStory("button"));
  storyReturnBtn.addEventListener("click", () => closeStory("return"));
  window.addEventListener("keydown", (event) => {
    const target = event.target;
    const typingTarget = target && target.closest && target.closest("input, textarea, [contenteditable='true']");
    if (event.key === "Escape" && story.open) {
      event.preventDefault();
      closeStory("escape");
      return;
    }
    if (!story.open && !typingTarget && !event.ctrlKey && !event.metaKey && !event.altKey && (event.key === "o" || event.key === "O")) {
      event.preventDefault();
      openStory("keyboard");
    }
  });

  // ─────────────────────────────────────────────────────────────
  // 摄像头 / MediaPipe Tasks Vision
  // 手势组件随文件一起放在 ./vendor，避免在线模型下载过慢导致初始化卡住。
  // ─────────────────────────────────────────────────────────────
  const HAND_CONNECTIONS = [
    [0, 1], [1, 2], [2, 3], [3, 4],
    [0, 5], [5, 6], [6, 7], [7, 8],
    [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16],
    [13, 17], [17, 18], [18, 19], [19, 20],
    [0, 17]
  ];

  async function ensureHandsLibrary() {
    if (app.camera.hands) return app.camera.hands;
    if (app.camera.libPromise) return app.camera.libPromise;

    app.camera.libPromise = (async () => {
      if (!/^https?:$/.test(window.location.protocol)) {
        throw new Error("needs-http-server");
      }

      const vendorRoot = new URL("./vendor/", document.baseURI);
      const bundleUrl = new URL("vision_bundle.js", vendorRoot).href;
      const wasmRoot = new URL("wasm", vendorRoot).href;
      const wasmProbeUrl = new URL("wasm/vision_wasm_internal.wasm", vendorRoot).href;
      const modelUrl = new URL("hand_landmarker.task", vendorRoot).href;

      // 先在本地探测资源，缺失时直接给出明确提示，而不是等待远端超时
      let modelProbe;
      let wasmProbe;
      try {
        [modelProbe, wasmProbe] = await Promise.all([
          fetch(modelUrl, { method: "HEAD", cache: "no-store" }),
          fetch(wasmProbeUrl, { method: "HEAD", cache: "no-store" })
        ]);
      } catch (err) {
        throw new Error("local-assets-unreachable");
      }
      if (!modelProbe.ok || !wasmProbe.ok) throw new Error("local-assets-missing");

      const vision = await import(bundleUrl);
      if (!vision || !vision.FilesetResolver || !vision.HandLandmarker) {
        throw new Error("vision-bundle-invalid");
      }

      const fileset = await vision.FilesetResolver.forVisionTasks(wasmRoot);
      const landmarker = await vision.HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: modelUrl,
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.56,
        minHandPresenceConfidence: 0.52,
        minTrackingConfidence: 0.5
      });

      app.camera.hands = landmarker;
      app.camera.libBase = "local vendor";
      return landmarker;
    })().catch((err) => {
      app.camera.libPromise = null;
      throw err;
    });

    return app.camera.libPromise;
  }

  function withTimeout(promise, ms, message) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(message)), ms);
      promise.then(
        (value) => {
          clearTimeout(timer);
          resolve(value);
        },
        (err) => {
          clearTimeout(timer);
          reject(err);
        }
      );
    });
  }

  // ─────────────────────────────────────────────────────────────
  // 摄像头：逐级降约束、逐台设备重试
  // NotReadableError（Could not start video source）在 Windows 上多半是
  // 设备被独占、硬件开关关闭或驱动卡住；换约束 / 换设备 / 稍后重试常能救回来。
  // ─────────────────────────────────────────────────────────────
  const CAMERA_BASE_VIDEO = {
    width: { ideal: 640 },
    height: { ideal: 480 },
    frameRate: { ideal: 24, max: 30 }
  };
  const CAMERA_DEVICE_KEY = "evergreen.cameraDeviceId";
  const CAMERA_FRAME_TIMEOUT = 3200;

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function cameraErrorName(err) {
    return String((err && (err.name || err.code)) || "");
  }

  function readSavedCameraId() {
    try { return localStorage.getItem(CAMERA_DEVICE_KEY) || ""; } catch (err) { return ""; }
  }

  function saveCameraId(id) {
    app.camera.deviceId = id || "";
    try {
      if (id) localStorage.setItem(CAMERA_DEVICE_KEY, id);
      else localStorage.removeItem(CAMERA_DEVICE_KEY);
    } catch (err) {
      // file:// 或隐私模式下 localStorage 可能不可用，忽略即可
    }
  }

  async function listVideoInputs() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter((device) => device.kind === "videoinput");
    } catch (err) {
      console.warn("[EVERGREEN] enumerateDevices failed", err);
      return [];
    }
  }

  function waitForVideoFrames(ms) {
    return new Promise((resolve) => {
      if (camVideo.videoWidth > 0) {
        resolve(true);
        return;
      }
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        camVideo.removeEventListener("loadeddata", check);
        camVideo.removeEventListener("playing", check);
        camVideo.removeEventListener("resize", check);
        resolve(ok);
      };
      const check = () => {
        if (camVideo.videoWidth > 0) finish(true);
      };
      const timer = setTimeout(() => finish(camVideo.videoWidth > 0), ms);
      camVideo.addEventListener("loadeddata", check);
      camVideo.addEventListener("playing", check);
      camVideo.addEventListener("resize", check);
    });
  }

  // 打开一条视频流并确认真有画面；失败时自己收尾，方便上层换设备再试
  async function tryCameraStream(videoConstraints, tag) {
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints });
      app.camera.stream = stream;
      camVideo.srcObject = stream;
      try {
        await camVideo.play();
      } catch (err) {
        // 某些浏览器需要用户手势后才会真正 begin playback；点击按钮已满足条件
        console.warn("[EVERGREEN] video.play()", err);
      }
      if (!(await waitForVideoFrames(CAMERA_FRAME_TIMEOUT))) {
        const err = new Error("no-video-frames");
        err.name = "NotReadableError";
        err.code = "no-frames";
        err.detail = tag;
        throw err;
      }
      return stream;
    } catch (err) {
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
      }
      if (!app.camera.stream || app.camera.stream === stream) app.camera.stream = null;
      camVideo.srcObject = null;
      throw err;
    }
  }

  async function openCameraStream() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const err = new Error("media-unsupported");
      err.code = "unsupported";
      err.name = "unsupported";
      throw err;
    }

    const preferred = app.camera.deviceId || readSavedCameraId();
    const devices = await listVideoInputs();
    // 有 label 说明已经拿到过权限，这时才按设备逐个尝试，避免反复弹权限框
    const hasLabels = devices.some((device) => !!(device.label && device.label.length));

    const attempts = [];
    if (preferred) {
      attempts.push({ tag: "preferred", video: Object.assign({ deviceId: { exact: preferred } }, CAMERA_BASE_VIDEO) });
      attempts.push({ tag: "preferred-bare", video: { deviceId: { exact: preferred } } });
    }
    attempts.push({ tag: "default", video: Object.assign({ facingMode: "user" }, CAMERA_BASE_VIDEO) });
    attempts.push({ tag: "default-bare", video: true });
    if (hasLabels && devices.length > 1) {
      devices.forEach((device, index) => {
        if (!device.deviceId || device.deviceId === preferred) return;
        attempts.push({
          tag: "device-" + index,
          video: Object.assign({ deviceId: { exact: device.deviceId } }, CAMERA_BASE_VIDEO)
        });
      });
    }

    const errors = [];
    for (let i = 0; i < attempts.length; i++) {
      // 上一次失败后设备需要一点时间释放，尤其是刚被别的程序放开的 USB 摄像头
      if (i > 0) await sleep(i < 3 ? 260 : 420);
      try {
        const stream = await tryCameraStream(attempts[i].video, attempts[i].tag);
        const track = stream.getVideoTracks()[0];
        const settings = track && track.getSettings ? track.getSettings() : {};
        app.camera.activeDeviceId = (settings && settings.deviceId) || preferred || "";
        saveCameraId(app.camera.activeDeviceId);
        return;
      } catch (err) {
        errors.push(err);
        console.warn("[EVERGREEN] camera attempt failed · " + attempts[i].tag, cameraErrorName(err), err && err.message);
        if (cameraErrorName(err) === "NotAllowedError" || cameraErrorName(err) === "PermissionDeniedError" || cameraErrorName(err) === "SecurityError") {
          throw err; // 权限被拒绝，换设备也没用
        }
      }
    }

    const informative =
      errors.find((err) => cameraErrorName(err) === "NotReadableError") ||
      errors.find((err) => cameraErrorName(err) === "NotFoundError") ||
      errors[errors.length - 1];
    if (informative) {
      informative.cameraAttempts = errors.map((err) => String((err && err.code) || cameraErrorName(err) || "unknown"));
      throw informative;
    }
    throw new Error("camera-start-failed");
  }

  function releaseCameraMedia() {
    app.camera.detecting = false;
    cancelAnimationFrame(app.camera.detectRaf);
    app.camera.detectRaf = 0;
    if (app.camera.stream) {
      for (const track of app.camera.stream.getTracks()) track.stop();
      app.camera.stream = null;
    }
    try { camVideo.pause(); } catch (e) {}
    camVideo.srcObject = null;
    cameraCard.classList.remove("visible");
    clearHandOverlay();
    app.camera.lastVideoTime = -1;
    app.camera.latestLandmarks = null;
    app.camera.hasResults = false;
    app.hasResults = false;
    app.hasHand = false;
    app.lastSeen = 0;
    app.camera.candidate = "none";
    app.camera.candidateFrames = 0;
    app.gesture = "none";
    app.peaceSince = 0;
    app.photoFocusIndex = -1;
    app.photoFocusHoldUntil = 0;
    app.photoAimIndex = -1;
    hideCameraFailure();
  }

  function hideCameraFailure() {
    cameraCard.classList.remove("failed");
    cameraTools.dataset.open = "0";
    camTip.hidden = true;
    camTip.textContent = "";
  }

  async function refreshCameraDevices() {
    const devices = await listVideoInputs();
    const current = app.camera.activeDeviceId || app.camera.deviceId || readSavedCameraId();
    const previous = camDeviceSelect.value;
    camDeviceSelect.innerHTML = "";
    if (!devices.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "未发现摄像头";
      camDeviceSelect.appendChild(option);
      camDeviceSelect.disabled = true;
    } else {
      camDeviceSelect.disabled = false;
      devices.forEach((device, index) => {
        const option = document.createElement("option");
        option.value = device.deviceId || "";
        option.textContent = device.label || "摄像头 " + (index + 1);
        camDeviceSelect.appendChild(option);
      });
      const wanted = current || previous;
      if (wanted && devices.some((device) => device.deviceId === wanted)) camDeviceSelect.value = wanted;
    }
    const failed = cameraCard.classList.contains("failed");
    cameraTools.dataset.open = failed || devices.length > 1 ? "1" : "0";
  }

  function markCameraFailure(err, tip) {
    const name = cameraErrorName(err);
    const noFrames = String((err && err.code) || "") === "no-frames";
    app.camera.lastErrorName = name;
    app.camera.lastErrorDetail = String((err && (err.message || err.detail)) || "");
    cameraCard.classList.add("visible", "failed");
    camErrorDetail.textContent = noFrames
      ? "设备已打开，但始终没有画面"
      : name === "NotReadableError" || name === "TrackStartError"
        ? "设备被占用，或硬件开关关闭"
        : name === "NotFoundError" || name === "DevicesNotFoundError"
          ? "系统里没有找到可用摄像头"
          : name === "NotAllowedError" || name === "PermissionDeniedError"
            ? "浏览器没有得到摄像头权限"
            : name || "启动失败";
    camTip.textContent = tip || "";
    camTip.hidden = !tip;
    refreshCameraDevices();
    lastUiKey = "";
    syncUI(performance.now());
  }

  async function startCamera() {
    if (app.mode === "camera") {
      stopCamera();
      return;
    }
    if (app.mode === "loading") return;
    stopDemo({ silent: true });
    hideCameraFailure();
    const token = ++app.camera.token;
    app.photoDebugFocus = -1;
    app.mode = "loading";
    lastUiKey = "";
    syncUI(performance.now());
    showToast("正在打开摄像头 · 请允许访问镜头", 5000);

    try {
      // 先打开镜头，再在本地初始化手势引擎，等待期间用户能看到自己的手
      await openCameraStream();
      if (token !== app.camera.token) {
        releaseCameraMedia();
        return;
      }
      cameraCard.classList.add("visible");
      updateCameraPreviewSize();
      lastUiKey = "";
      syncUI(performance.now());
      showToast("镜头已就绪 · 正在本地初始化手势引擎，首次启动约需片刻", 6200);

      await withTimeout(ensureHandsLibrary(), 45000, "vision-init-timeout");
      if (token !== app.camera.token) {
        releaseCameraMedia();
        return;
      }

      app.mode = "camera";
      app.hasResults = false;
      app.hasHand = false;
      app.gesture = "none";
      app.lastSeen = 0;
      app.camera.candidate = "none";
      app.camera.candidateFrames = 0;
      cameraCard.classList.add("visible");
      updateCameraPreviewSize();
      app.camera.detecting = true;
      app.camera.lastVideoTime = -1;
      startDetectionLoop();
      refreshCameraDevices();
      lastUiKey = "";
      syncUI(performance.now());
      showToast("手势已就绪 · 张开看照片，比 OK 放大，比耶查看来信", 5000);
    } catch (err) {
      console.warn("[EVERGREEN] camera start failed", err);
      if (token !== app.camera.token) return;
      releaseCameraMedia();
      app.mode = "idle";
      lastUiKey = "";
      syncUI(performance.now());

      const errName = cameraErrorName(err);
      const errCode = String((err && err.code) || "");
      const rawMsg = String(err && err.message || "");
      const noFrames = errCode === "no-frames";
      let message = "摄像头没有成功连接。已为你切换到演示模式。";
      let tip = "检查摄像头是否被占用，或在左下角换一台设备后点重试。";
      let showPicker = true;
      if (errName === "NotAllowedError" || errName === "PermissionDeniedError") {
        message = "摄像头权限被拒绝。已切换到演示模式，也可以重新允许权限。";
        tip = "点击地址栏左侧的摄像头图标，把权限改成“允许”，再点重试。";
      } else if (errName === "NotFoundError" || errName === "DevicesNotFoundError") {
        message = "没有找到可用摄像头。已切换到演示模式。";
        tip = "确认摄像头没被禁用：ASUS 笔记本可按 F10 打开摄像头；也可以运行 camera-doctor.bat 检查驱动。";
      } else if (noFrames) {
        message = "摄像头已打开但没有画面，已切换到演示模式。";
        tip = "常见原因：硬件开关关闭、被别的程序抢占、驱动卡住。先关掉微信视频 / ToDesk 远程摄像头，再运行 camera-doctor.bat 重置设备。";
      } else if (errName === "NotReadableError" || errName === "TrackStartError" || errName === "AbortError") {
        message = "摄像头无法启动，通常是被其他程序占用。已切换到演示模式。";
        tip = "先关闭微信视频、ToDesk 远程摄像头、会议软件，以及别的浏览器标签里的摄像头，再点重试。";
      } else if (rawMsg.indexOf("local-assets") === 0) {
        message = "本地手势组件缺失，请保持 vendor 文件夹与 HTML 在同一目录。已切换到演示模式。";
        tip = "";
        showPicker = false;
      } else if (rawMsg === "needs-http-server") {
        message = "摄像头与手势引擎需要通过本地服务器打开，请使用随附的 start-server.bat。";
        tip = "";
        showPicker = false;
      } else if (rawMsg === "local-assets-unreachable") {
        message = "无法读取本地手势组件，请确认 vendor 文件夹完整。已切换到演示模式。";
        tip = "";
        showPicker = false;
      } else if (rawMsg === "vision-init-timeout") {
        message = "手势引擎启动超时，已切换到演示模式。可以稍后重试。";
        tip = "";
        showPicker = false;
      } else if (rawMsg.indexOf("vision-") === 0 || rawMsg.indexOf("local-") === 0) {
        message = "手势引擎初始化失败，已切换到演示模式。";
        tip = "";
        showPicker = false;
      } else if (!navigator.mediaDevices) {
        message = "当前页面无法使用摄像头，请通过 localhost 或 HTTPS 打开。已进入演示模式。";
        tip = "";
        showPicker = false;
      }
      showToast(message, 7200, true);
      if (showPicker) markCameraFailure(err, tip);

      setTimeout(() => {
        if (app.mode === "idle" && !story.open) {
          startDemo({ silent: true });
          showToast("演示模式 · 按住鼠标 / 手指张开，左右移动试试", 4200);
        }
      }, 900);
    }
  }

  function stopCamera(showMessage = false) {
    app.camera.token++;
    const wasCamera = app.mode === "camera" || app.mode === "loading";
    releaseCameraMedia();
    if (app.mode !== "demo") app.mode = "idle";
    app.gesture = "none";
    app.openTarget = 0;
    lastUiKey = "";
    syncUI(performance.now());
    if (wasCamera && showMessage) showToast("摄像头已关闭 · 圣诞树恢复完整", 2200);
  }

  function startDemo(options = {}) {
    const silent = !!options.silent;
    if (app.mode === "demo") return;
    if (app.mode === "camera" || app.mode === "loading") {
      app.camera.token++;
      releaseCameraMedia();
    }
    app.mode = "demo";
    app.demo.down = false;
    app.demo.keyOpen = false;
    app.demo.pointerActive = false;
    app.demo.debugOpen = false;
    app.demo.x = 0.5;
    app.demo.y = 0.5;
    app.gesture = "none";
    app.openTarget = 0;
    lastUiKey = "";
    syncUI(performance.now());
    if (!silent) showToast("演示模式 · 按住鼠标或手指张开，左右移动挥动光球", 4200);
  }

  function stopDemo(options = {}) {
    const silent = !!options.silent;
    if (app.mode !== "demo") return;
    app.mode = "idle";
    app.demo.down = false;
    app.demo.keyOpen = false;
    app.demo.pointerActive = false;
    app.demo.debugOpen = false;
    app.gesture = "none";
    app.openTarget = 0;
    lastUiKey = "";
    syncUI(performance.now());
    if (!silent) showToast("已退出演示 · 圣诞树恢复完整", 2000);
  }

  function startDetectionLoop() {
    let lastTimestamp = 0;
    const loop = () => {
      if (!app.camera.detecting) return;
      const landmarker = app.camera.hands;
      if (landmarker && camVideo.readyState >= 2) {
        const time = camVideo.currentTime;
        if (time !== app.camera.lastVideoTime) {
          app.camera.lastVideoTime = time;
          app.camera.sendStarted++;
          app.camera.lastSendAt = performance.now();
          try {
            // VIDEO 模式要求严格递增的时间戳
            const timestamp = Math.max(lastTimestamp + 1, Math.round(performance.now()));
            lastTimestamp = timestamp;
            const results = landmarker.detectForVideo(camVideo, timestamp);
            app.camera.sendFinished++;
            onHandsResults(results);
          } catch (err) {
            console.warn("[EVERGREEN] detection error", err);
            app.camera.lastError = String(err && (err.stack || err.message) || err);
            app.camera.detecting = false;
            if (app.mode === "camera") {
              releaseCameraMedia();
              app.mode = "idle";
              lastUiKey = "";
              syncUI(performance.now());
              showToast("手势引擎运行异常 · 已切换到演示模式", 5200, true);
              setTimeout(() => {
                if (app.mode === "idle" && !story.open) startDemo({ silent: true });
              }, 800);
            }
            return;
          }
        }
      }
      if (app.camera.detecting) app.camera.detectRaf = requestAnimationFrame(loop);
    };
    loop();
  }

  /**
   * 判断四根手指是否伸直。MediaPipe 的 z 轴比例不稳定，核心判断只用 xy。
   * 返回可解释的分数，便于做二段式去抖。
   */
  function analyseHand(lm) {
    const fingers = [
      { tip: 8, pip: 6, mcp: 5 },
      { tip: 12, pip: 10, mcp: 9 },
      { tip: 16, pip: 14, mcp: 13 },
      { tip: 20, pip: 18, mcp: 17 }
    ];
    const wrist = lm[0];
    const palmCenter = {
      x: (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5,
      y: (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5,
      z: 0
    };
    const palmScale = Math.max(0.0001, Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y));
    let count = 0;
    let ratioSum = 0;
    const extensions = [];
    for (const f of fingers) {
      const tip = lm[f.tip], pip = lm[f.pip], mcp = lm[f.mcp];
      const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
      const pipDist = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
      const ratio = tipDist / Math.max(0.0001, pipDist);
      const vTip = { x: tip.x - pip.x, y: tip.y - pip.y };
      const vMcp = { x: mcp.x - pip.x, y: mcp.y - pip.y };
      const vtLen = Math.hypot(vTip.x, vTip.y) || 0.0001;
      const vmLen = Math.hypot(vMcp.x, vMcp.y) || 0.0001;
      const straightness = -(vTip.x * vMcp.x + vTip.y * vMcp.y) / (vtLen * vmLen);
      const extended = ratio > 1.055 && straightness > 0.08;
      if (extended) count++;
      ratioSum += ratio;
      extensions.push(extended);
    }
    const avgRatio = ratioSum / 4;
    const tipToPalm = (
      Math.hypot(lm[8].x - palmCenter.x, lm[8].y - palmCenter.y) +
      Math.hypot(lm[12].x - palmCenter.x, lm[12].y - palmCenter.y) +
      Math.hypot(lm[16].x - palmCenter.x, lm[16].y - palmCenter.y) +
      Math.hypot(lm[20].x - palmCenter.x, lm[20].y - palmCenter.y)
    ) / (4 * palmScale);

    // OK：拇指与食指围成小圈，中指/无名指/小指保持伸展。
    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / palmScale;
    const okRing = pinch < 0.64 && extensions[1] && extensions[2] && extensions[3];

    // 比耶：食指与中指伸展、分开，无名指和小指弯曲。
    const lowerFingersCurled = !extensions[2] && !extensions[3];
    const vIndexX = lm[8].x - lm[5].x;
    const vIndexY = lm[8].y - lm[5].y;
    const vMiddleX = lm[12].x - lm[9].x;
    const vMiddleY = lm[12].y - lm[9].y;
    const vIndexLen = Math.hypot(vIndexX, vIndexY) || 0.0001;
    const vMiddleLen = Math.hypot(vMiddleX, vMiddleY) || 0.0001;
    const vAngle = Math.acos(clamp(
      (vIndexX * vMiddleX + vIndexY * vMiddleY) / (vIndexLen * vMiddleLen),
      -1,
      1
    ));
    const vTipGap = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y) / palmScale;
    const peace = extensions[0] && extensions[1] && lowerFingersCurled && vAngle > 0.12 && vTipGap > 0.3;

    let gesture = "neutral";
    if (okRing) {
      gesture = "ok";
    } else if (peace) {
      gesture = "peace";
    } else if (count >= 4 || (count === 3 && avgRatio > 1.27 && tipToPalm > 1.18)) {
      gesture = "open";
    } else if (count <= 1 && avgRatio < 1.34) {
      gesture = "fist";
    }
    return { gesture, count, avgRatio, tipToPalm, pinch, extensions, peace, vAngle, vTipGap };
  }

  function updateGestureFromLandmarks(lm, now) {
    const result = analyseHand(lm);
    const candidate = result.gesture;
    const cam = app.camera;

    if (candidate !== "peace") app.peaceSince = 0;

    if (candidate === "open" || candidate === "fist" || candidate === "ok" || candidate === "peace") {
      if (candidate === cam.candidate) {
        cam.candidateFrames++;
      } else {
        cam.candidate = candidate;
        cam.candidateFrames = 1;
        cam.candidateSince = now;
      }
      if (
        app.gesture !== candidate &&
        cam.candidateFrames >= 3 &&
        now - cam.candidateSince > 55
      ) {
        app.gesture = candidate;
        app.lastGestureAt = now;
        if (candidate === "open") {
          app.waveUntil = now + 150;
        } else if (candidate === "peace") {
          app.peaceSince = now;
        }
      }
    } else {
      // 中间态不立刻改变结果，避免手指经过半伸状态时树来回闪动
      if (now - app.lastGestureAt > 620) {
        app.gesture = "none";
      }
      app.peaceSince = 0;
      cam.candidate = "neutral";
      cam.candidateFrames = 0;
    }
  }

  function onHandsResults(results) {
    if (app.mode !== "camera") return;
    app.hasResults = true;
    app.camera.hasResults = true;
    app.camera.lastResultAt = performance.now();
    const now = performance.now();
    const hands = results && results.landmarks;
    const lm = hands && hands.length ? hands[0] : null;

    if (lm && lm.length >= 21) {
      app.camera.latestLandmarks = lm;
      app.lastSeen = now;
      app.hasHand = true;
      app.camera.rawX = clamp(1 - (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5, 0, 1);
      app.camera.rawY = clamp((lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5, 0, 1);
      updateGestureFromLandmarks(lm, now);
      drawHandOverlay(lm);
    } else {
      app.camera.latestLandmarks = null;
      if (now - app.lastSeen > 300) {
        app.hasHand = false;
        app.gesture = "none";
        app.camera.candidate = "none";
        app.camera.candidateFrames = 0;
      }
      clearHandOverlay();
    }
    syncUI(now);
  }

  function clearHandOverlay() {
    const c = camOverlay.getContext("2d");
    c.clearRect(0, 0, camOverlay.width, camOverlay.height);
  }

  function drawHandOverlay(lm) {
    if (!camOverlay.width || !camOverlay.height) updateCameraPreviewSize();
    const rect = camOverlay.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const c = camOverlay.getContext("2d");
    const dpr = camOverlay.width / Math.max(1, rect.width);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, camOverlay.width, camOverlay.height);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cw = rect.width;
    const ch = rect.height;
    const vw = camVideo.videoWidth || 4;
    const vh = camVideo.videoHeight || 3;
    const videoScale = Math.max(cw / vw, ch / vh);
    const dw = vw * videoScale;
    const dh = vh * videoScale;
    const ox = (cw - dw) / 2;
    const oy = (ch - dh) / 2;
    const points = lm.map((p) => ({
      x: ox + (1 - p.x) * dw,
      y: oy + p.y * dh
    }));

    c.lineCap = "round";
    c.lineJoin = "round";

    // 外描边让骨骼在亮背景上依然可见
    c.strokeStyle = "rgba(2, 16, 13, .7)";
    c.lineWidth = 3.6;
    c.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      c.moveTo(points[a].x, points[a].y);
      c.lineTo(points[b].x, points[b].y);
    }
    c.stroke();

    c.strokeStyle = "rgba(158, 255, 215, .88)";
    c.lineWidth = 1.15;
    c.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      c.moveTo(points[a].x, points[a].y);
      c.lineTo(points[b].x, points[b].y);
    }
    c.stroke();

    const fingertips = new Set([4, 8, 12, 16, 20]);
    for (let i = 0; i < points.length; i++) {
      const isTip = fingertips.has(i);
      c.globalAlpha = isTip ? 1 : 0.62;
      c.fillStyle = isTip ? "#ffe9b9" : "#c4ffe8";
      c.beginPath();
      c.arc(points[i].x, points[i].y, isTip ? 2.2 : 1.15, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;

    const palm = {
      x: (points[0].x + points[5].x + points[9].x + points[13].x + points[17].x) / 5,
      y: (points[0].y + points[5].y + points[9].y + points[13].y + points[17].y) / 5
    };
    const t = performance.now() / 1000;
    c.strokeStyle = "rgba(255, 217, 152, .48)";
    c.lineWidth = 0.8;
    c.beginPath();
    c.arc(palm.x, palm.y, 7 + Math.sin(t * 2.1) * 1.3, 0, TAU);
    c.stroke();
    c.fillStyle = "rgba(255, 235, 192, .9)";
    c.beginPath();
    c.arc(palm.x, palm.y, 1.5, 0, TAU);
    c.fill();
  }

  // ─────────────────────────────────────────────────────────────
  // 事件
  // ─────────────────────────────────────────────────────────────
  cameraBtn.addEventListener("click", () => {
    if (app.mode === "loading") return;
    if (app.mode === "camera") stopCamera(true);
    else startCamera();
  });

  camRetryBtn.addEventListener("click", () => {
    if (app.mode === "loading" || app.mode === "camera") return;
    startCamera();
  });

  camDismissBtn.addEventListener("click", () => {
    hideCameraFailure();
    if (app.mode !== "camera" && app.mode !== "loading") cameraCard.classList.remove("visible");
    lastUiKey = "";
    syncUI(performance.now());
  });

  camDeviceSelect.addEventListener("change", () => {
    saveCameraId(camDeviceSelect.value);
    if (app.mode === "loading" || app.mode === "camera") return;
    startCamera();
  });

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener("devicechange", () => {
      if (app.mode === "camera" || app.mode === "loading") return;
      refreshCameraDevices();
    });
  }

  demoBtn.addEventListener("click", () => {
    if (app.mode === "loading") return;
    if (app.mode === "demo") stopDemo();
    else startDemo();
  });

  fullscreenBtn.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (err) {
      showToast("当前浏览器不支持全屏", 2200, true);
    }
  });

  window.addEventListener("pointermove", (event) => {
    if (app.mode !== "demo") return;
    app.demo.pointerActive = true;
    app.demo.x = clamp(event.clientX / Math.max(1, view.w), 0.02, 0.98);
    app.demo.y = clamp(event.clientY / Math.max(1, view.h), 0.03, 0.95);
  }, { passive: true });

  function isUiTarget(target) {
    return !!(target && target.closest && target.closest(".topbar, .footer, .camera-card, .toast"));
  }

  window.addEventListener("pointerdown", (event) => {
    if (app.mode !== "demo") return;
    if (event.button !== undefined && event.button !== 0 && event.pointerType === "mouse") return;
    if (isUiTarget(event.target)) return;
    app.demo.down = true;
    app.demo.pointerActive = true;
    app.demo.x = clamp(event.clientX / Math.max(1, view.w), 0.02, 0.98);
    app.demo.y = clamp(event.clientY / Math.max(1, view.h), 0.03, 0.95);
  }, { passive: true });

  window.addEventListener("pointerup", () => {
    if (app.mode !== "demo") return;
    app.demo.down = false;
  }, { passive: true });

  window.addEventListener("pointercancel", () => {
    app.demo.down = false;
    app.demo.keyOpen = false;
  }, { passive: true });

  window.addEventListener("blur", () => {
    app.demo.down = false;
    app.demo.keyOpen = false;
  });

  window.addEventListener("keydown", (event) => {
    if (app.mode !== "demo") return;
    if (event.code === "Space" && !isUiTarget(event.target)) {
      if (!app.demo.keyOpen) {
        app.demo.keyOpen = true;
        if (!app.demo.pointerActive) {
          app.demo.pointerActive = true;
          app.demo.x = 0.52;
          app.demo.y = 0.46;
        }
      }
      event.preventDefault();
    }
  });

  window.addEventListener("keyup", (event) => {
    if (event.code === "Space") app.demo.keyOpen = false;
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 110);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) app.lastFrame = performance.now();
  });

  // ─────────────────────────────────────────────────────────────
  // 调试 API（也方便截图与自动化）
  // ─────────────────────────────────────────────────────────────
  window.__xmas = {
    demo() {
      if (app.mode !== "demo") startDemo({ silent: true });
    },
    open(value = true) {
      if (app.mode !== "demo") startDemo({ silent: true });
      app.demo.debugOpen = !!value;
      app.demo.pointerActive = true;
    },
    setHand(x, y) {
      if (app.mode !== "demo") startDemo({ silent: true });
      app.demo.pointerActive = true;
      app.demo.x = clamp(Number(x), 0.01, 0.99);
      app.demo.y = clamp(Number(y), 0.01, 0.99);
    },
    focusPhoto(index = 2) {
      if (app.mode !== "demo") startDemo({ silent: true });
      app.demo.debugOpen = true;
      app.demo.pointerActive = true;
      app.demo.x = 0.5;
      app.demo.y = 0.5;
      app.photoDebugFocus = clamp(Math.round(Number(index)), 0, photoCards.length - 1);
    },
    releasePhoto() {
      app.photoDebugFocus = -1;
    },
    story() {
      openStory("debug");
    },
    closeStory() {
      closeStory("debug");
    },
    analyse(landmarks) {
      return Array.isArray(landmarks) && landmarks.length >= 21 ? analyseHand(landmarks) : null;
    },
    state() {
      return {
        mode: app.mode,
        openness: Number(app.openness.toFixed(3)),
        gesture: app.gesture,
        handVisible: app.hand.visible,
        hand: {
          x: Number(app.hand.x.toFixed(3)),
          y: Number(app.hand.y.toFixed(3)),
          nx: Number(app.hand.nx.toFixed(3)),
          ny: Number(app.hand.ny.toFixed(3))
        },
        particles: particles.length,
        hasResults: app.hasResults,
        hasHand: app.hasHand,
        peaceSince: Math.round(app.peaceSince || 0),
        photoFocusIndex: app.photoFocusIndex,
        photoAimIndex: app.photoAimIndex,
        photoDebugFocus: app.photoDebugFocus,
        photos: photoCards.map((card) => ({ loaded: card.loaded, focus: Number(card.focus.toFixed(2)) })),
        storyOpen: story.open,
        storyPage: story.page,
        library: app.camera.libBase,
        pipeline: {
          sendStarted: app.camera.sendStarted,
          sendFinished: app.camera.sendFinished,
          lastSendAt: Math.round(app.camera.lastSendAt),
          lastResultAt: Math.round(app.camera.lastResultAt || 0),
          error: app.camera.lastError
        },
        video: {
          readyState: camVideo.readyState,
          width: camVideo.videoWidth,
          height: camVideo.videoHeight,
          streaming: !!(app.camera.stream && app.camera.stream.active)
        }
      };
    }
  };

  // URL 调试参数：?demo=1&open=1&hand=.68,.42 / ?story=1 / ?photo=2
  const params = new URLSearchParams(window.location.search);
  if (params.get("demo") === "1") {
    setTimeout(() => {
      startDemo({ silent: true });
      if (params.get("open") === "1") {
        app.demo.debugOpen = true;
        app.demo.pointerActive = true;
      }
      const h = params.get("hand");
      if (h) {
        const parts = h.split(",").map(Number);
        if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
          app.demo.pointerActive = true;
          app.demo.x = clamp(parts[0], 0.01, 0.99);
          app.demo.y = clamp(parts[1], 0.01, 0.99);
        }
      }
    }, 260);
  }
  if (params.get("story") === "1") {
    setTimeout(() => openStory("url"), 420);
  }
  if (params.has("photo")) {
    setTimeout(() => {
      startDemo({ silent: true });
      app.demo.debugOpen = true;
      app.demo.pointerActive = true;
      app.demo.x = 0.5;
      app.demo.y = 0.5;
      const index = Number(params.get("photo"));
      app.photoDebugFocus = Number.isFinite(index) ? clamp(Math.round(index), 0, photoCards.length - 1) : 2;
    }, 320);
  }

  // ─────────────────────────────────────────────────────────────
  // 启动
  // ─────────────────────────────────────────────────────────────
  initSprites();
  initPhotoCards();
  resize();
  app.startTime = performance.now();
  app.lastFrame = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
